name: Local Models Check

on:
  push:
    paths:
      - 'app/models.yaml'
      - 'models/**'
  workflow_dispatch:

jobs:
  validate-models-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify Config & Lockfile Consistency
        run: |
          pip install pyyaml pydantic
          python -c "
          import yaml
          from app.config import ConfigManager
          cm = ConfigManager.get_instance()
          assert 'fast' in cm.models_config.profiles
          assert 'balanced' in cm.models_config.profiles
          print('Models YAML schema validated.')
          "
