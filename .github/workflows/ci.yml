name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit & Layering Tests
        run: |
          pytest tests/unit/ -v

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ -v

      - name: Run Eval Suite (Quality Gate)
        run: |
          python evals/run.py --fail-under 0.85
